name: Release

# A version bump on main is the release signal. The workflow publishes
# plugin/package.json to npm, then tags the commit and opens a GitHub Release.
#
# npm comes first: a tag and a Release advertise a version, so they must not
# exist until the version is installable. The tag check at the top makes a
# re-run idempotent and keeps an unrelated edit to package.json from
# re-releasing an old version.
on:
  push:
    branches: ["main"]
    paths: ["plugin/package.json"]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub Release
  id-token: write # npm Trusted Publishing (OIDC) -- no NPM_TOKEN is stored

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Windows, like CI: the suite imports winapi code (ctypes.WinDLL) that does
    # not exist on Linux. The steps written in bash say so explicitly, because
    # the default shell here is PowerShell.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes needs the tags and full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install package
        run: python -m pip install --upgrade pip -e .

      # Gated on the same tests CI runs: publishing is not reversible, so a
      # red suite must not reach the registry.
      - name: Unit tests (unittest)
        run: python -m unittest discover -s tests

      - name: Node tests
        run: node --test

      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          version = json.loads(
              pathlib.Path("plugin/package.json").read_text(encoding="utf-8")
          )["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"plugin/package.json version is not X.Y.Z: {version!r}")

          project = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', project, re.MULTILINE)
          declared = match.group(1) if match else None
          if declared != version:
              sys.exit(
                  f"pyproject.toml version {declared!r} does not match "
                  f"plugin/package.json {version!r}"
              )

          init = pathlib.Path("src/rebind_me/__init__.py").read_text(encoding="utf-8")
          attr = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.MULTILINE)
          declared = attr.group(1) if attr else None
          if declared != version:
              sys.exit(
                  f"rebind_me.__version__ {declared!r} does not match "
                  f"plugin/package.json {version!r}"
              )

          tag = f"v{version}"
          exists = subprocess.run(
              ["git", "rev-parse", "--verify", "--quiet", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              if exists:
                  print(f"{tag} is already tagged; nothing to release")
                  out.write("release=false\n")
              else:
                  out.write(f"release=true\nversion={version}\ntag={tag}\n")
          PY

      # Trusted Publishing: setup-node writes an .npmrc referencing
      # NODE_AUTH_TOKEN, but no such secret is set, so npm authenticates with
      # the OIDC token from the id-token: write permission instead.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        working-directory: plugin
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "rebind-me@${version}" version >/dev/null 2>&1; then
            echo "rebind-me@${version} is already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Tag the commit and open the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
