name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip -e .

      - name: Syntax check (py_compile)
        run: python -m compileall -q src tests

      - name: Unit tests (unittest)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Node syntax check
        run: |
          node --check plugin/events.mjs
          node --check plugin/bridge.mjs
          node --check src/rebind_me/ui/app.js

      - name: Typecheck plugin
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Node tests
        run: node --test
